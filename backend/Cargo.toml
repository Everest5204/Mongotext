[package]
name = "mongotext-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15.7"
futures-util = "0.3"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
mongodb = "3.10.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-sessions = "0.14"